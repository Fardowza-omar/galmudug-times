<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Reset Password - Galmudug Times</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            background: #0a0a0a; position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(102,126,234,0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(118,75,162,0.1) 0%, transparent 50%);
            animation: drift 20s ease-in-out infinite alternate;
        }
        @keyframes drift { 0% { transform: translate(0,0) rotate(0deg); } 100% { transform: translate(-2%,2%) rotate(3deg); } }
        .container { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 1.5rem; }
        .card {
            background: rgba(255,255,255,0.03); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            padding: 3rem 2.5rem; box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .brand-icon {
            width: 56px; height: 56px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem; font-size: 1.5rem;
        }
        .title { font-family: 'UnifrakturMaguntia', cursive; font-size: 1.8rem; color: #fff; letter-spacing: 0.02em; }
        .subtitle { font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-top: 0.4rem; font-weight: 500; }
        .desc { font-size: 0.85rem; color: rgba(255,255,255,0.5); line-height: 1.6; margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.5rem; color: rgba(255,255,255,0.5); }
        .input-wrapper { position: relative; }
        input {
            width: 100%; padding: 0.85rem 1rem; background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; font-size: 0.95rem;
            font-family: inherit; color: #fff; transition: all 0.3s ease;
        }
        input::placeholder { color: rgba(255,255,255,0.25); }
        input:focus { outline: none; border-color: #667eea; background: rgba(102,126,234,0.08); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .toggle-pwd {
            position: absolute; right: 0.85rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.3);
            font-size: 0.85rem; padding: 0.25rem; transition: color 0.2s;
        }
        .toggle-pwd:hover { color: rgba(255,255,255,0.6); }
        .strength-bar { height: 4px; background: #222; border-radius: 2px; margin-top: 0.5rem; overflow: hidden; }
        .strength-fill { height: 100%; width: 0; transition: width 0.3s, background 0.3s; border-radius: 2px; }
        .strength-text { font-size: 0.7rem; margin-top: 0.25rem; color: #999; }
        .btn {
            width: 100%; padding: 0.95rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 10px; font-size: 0.85rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.12em; cursor: pointer; transition: all 0.3s ease; margin-top: 0.75rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(102,126,234,0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .alert {
            padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1.25rem;
            font-size: 0.82rem; display: none; animation: slideIn 0.3s ease;
        }
        .alert.show { display: block; }
        .alert-error { background: rgba(214,48,49,0.12); color: #f87171; border: 1px solid rgba(214,48,49,0.2); }
        .alert-success { background: rgba(39,174,96,0.12); color: #6ee7b7; border: 1px solid rgba(39,174,96,0.2); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: rgba(255,255,255,0.4); font-size: 0.8rem; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #667eea; }
        .footer-text { text-align: center; margin-top: 2rem; font-size: 0.72rem; color: rgba(255,255,255,0.2); letter-spacing: 0.05em; }
        .match-msg { font-size: 0.72rem; margin-top: 0.25rem; }
        @media (max-width: 480px) { .card { padding: 2rem 1.5rem; } .title { font-size: 1.5rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="brand-icon">🔒</div>
                <h1 class="title">Galmudug Times</h1>
                <p class="subtitle">Set New Password</p>
            </div>

            <p class="desc">Enter your new password below.</p>

            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="resetForm" autocomplete="off">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" required placeholder="Min 6 characters" autocomplete="new-password" style="padding-right:2.5rem;">
                        <button type="button" class="toggle-pwd" id="togglePwd1" tabindex="-1">👁</button>
                    </div>
                    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" required placeholder="Re-enter new password" autocomplete="new-password" style="padding-right:2.5rem;">
                        <button type="button" class="toggle-pwd" id="togglePwd2" tabindex="-1">👁</button>
                    </div>
                    <div class="match-msg" id="matchMsg"></div>
                </div>
                <button type="submit" class="btn" id="submitBtn">Reset Password</button>
            </form>

            <a href="login.html" class="back-link">&larr; Back to Sign In</a>
            <p class="footer-text">Galmudug Times &copy; 2026</p>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('resetForm');
        const btn = document.getElementById('submitBtn');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        if (!token) {
            document.querySelector('.desc').textContent = 'Invalid reset link. Please request a new one.';
            form.style.display = 'none';
        }

        function showAlert(type, msg) {
            const el = type === 'error' ? errorAlert : successAlert;
            const other = type === 'error' ? successAlert : errorAlert;
            other.classList.remove('show');
            el.textContent = msg;
            el.classList.add('show');
        }

        // Password strength
        document.getElementById('newPassword').addEventListener('input', (e) => {
            const v = e.target.value;
            let score = 0;
            if (v.length >= 6) score++;
            if (v.length >= 10) score++;
            if (/[A-Z]/.test(v)) score++;
            if (/[0-9]/.test(v)) score++;
            if (/[^A-Za-z0-9]/.test(v)) score++;
            const colors = ['#ef4444','#f97316','#eab308','#22c55e','#22c55e'];
            const labels = ['Weak','Fair','Good','Strong','Very Strong'];
            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');
            fill.style.width = (score * 20) + '%';
            fill.style.background = colors[Math.max(0, score - 1)] || '#222';
            text.textContent = v.length ? labels[Math.max(0, score - 1)] : '';
            text.style.color = colors[Math.max(0, score - 1)] || '#999';
            checkMatch();
        });

        document.getElementById('confirmPassword').addEventListener('input', checkMatch);

        function checkMatch() {
            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('matchMsg');
            if (!p2) { msg.textContent = ''; return; }
            if (p1 === p2) { msg.textContent = 'Passwords match ✓'; msg.style.color = '#22c55e'; }
            else { msg.textContent = 'Passwords do not match'; msg.style.color = '#ef4444'; }
        }

        // Toggle password visibility
        document.getElementById('togglePwd1').addEventListener('click', () => {
            const inp = document.getElementById('newPassword');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });
        document.getElementById('togglePwd2').addEventListener('click', () => {
            const inp = document.getElementById('confirmPassword');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!newPassword || newPassword.length < 6) { showAlert('error', 'Password must be at least 6 characters'); return; }
            if (newPassword !== confirmPassword) { showAlert('error', 'Passwords do not match'); return; }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Something went wrong');
                showAlert('success', 'Password reset successfully! Redirecting to login...');
                form.style.display = 'none';
                setTimeout(() => { window.location.href = 'login.html'; }, 2500);
            } catch (err) {
                showAlert('error', err.message);
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
